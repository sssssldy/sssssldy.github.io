
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的野外采样足迹与随笔</title>
    <!-- 引入 Leaflet 地图库的样式与脚本 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        /* 页面整体布局：左右 1/6 留白 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /* 页面基础UI字体：使用现代、清晰的无衬线系统字体 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            overflow: hidden; /* 禁止全屏滚动 */
            background-color: #0c0c0e; /* 网页最外层留白背景（极深优雅黑） */
            display: flex;
            justify-content: center; /* 居中显示核心内容 */
            align-items: center;
        }

        /* 核心展示区域：左右各空出 1/6 (总宽度占 66.67%) */
        #main-wrapper {
            width: 66.67%;
            height: 100%;
            position: relative;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.7); /* 为边缘添加微弱投影 */
            overflow: hidden;
        }

        /* 背景媒体容器：并排容纳地图与九宫格照片墙 */
        #media-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            z-index: 1;
        }

        /* 左侧地图区域：占 wrapper 的 50% 宽度 */
        #map-container {
            width: 50%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* 右侧展示区域：占 wrapper 的 50% 宽度，三列九宫格网格 */
        #photo-stream {
            width: 50%;
            height: 100%;
            box-sizing: border-box;
            padding: 40px 30px 45vh 30px; /* 底部留出足够空间，防止图片被初始浮动卡片遮挡 */
            background-color: #16161a; /* 深色面板背景 */
            border-left: 1px solid #2a2a30;
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 确认为三列九宫格排布 */
            gap: 12px; /* 照片卡片之间的间距 */
            grid-auto-rows: max-content;
            overflow-y: auto; /* 照片墙自身可独立滚动 */
        }

        /* 九宫格单张图片卡片 */
        .photo-card {
            width: 100%;
            border-radius: 6px; 
            overflow: hidden;
            background-color: #1a1a1f; /* 卡片背景色 */
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        
        .photo-card:hover {
            transform: scale(1.04); /* 悬停时轻微放大 */
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }

        /* 卡片中的图片样式：完美正方形裁剪 */
        .photo-card img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1; /* 核心：强制正方形比例 */
            object-fit: cover; /* 核心：不拉伸不变形，按中心自动裁剪填满 */
            filter: brightness(0.9);
            transition: filter 0.3s ease;
            cursor: pointer; /* 悬停时手势提示 */
        }

        .photo-card:hover img {
            filter: brightness(1.05); /* 悬停时图片微微变亮 */
        }

        /* 照片下方的精致标题框 */
        .photo-caption {
            padding: 8px 5px;
            color: #aaaaaa; /* 降低亮度，减少视觉干扰 */
            font-size: 0.72rem; /* 适当缩小字体以适应三列小格 */
            text-align: center;
            font-weight: 400;
            letter-spacing: 1px; /* 字母间距拉开，更具设计感 */
            background-color: #111114; /* 稍微深一些的底部标题栏 */
            border-top: 1px solid #25252b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; /* 文字超长时显示省略号 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        /* 全局滚动文本层：浮动在媒体层之上 */
        #text-overlay-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto; /* 允许此处进行整站纵向滚动 */
            z-index: 2;
            pointer-events: none; /* 关键：点击穿透，使上方 2/3 的地图和照片依然可以被交互 */
        }

        /* 顶部占位器：占屏幕高度的 2/3 (即从底部 1/3 开始显示文字) */
        #text-overlay-container .spacer {
            height: 66.67vh;
            pointer-events: none;
        }

        /* 悬浮文字内容卡片 */
        #site-text-card {
            pointer-events: auto; /* 恢复卡片区域的鼠标交互 */
            background: linear-gradient(to bottom, rgba(22, 22, 26, 0.92) 0%, rgba(22, 22, 26, 0.99) 150px, #16161a 100%);
            backdrop-filter: blur(15px); /* 强化现代毛玻璃半透明效果 */
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.08); /* 精致的分界线 */
            padding: 45px 55px 65px 55px; /* 增加内边距，让排版更加呼吸透气 */
            box-sizing: border-box;
            min-height: 33.33vh; /* 保证至少填满下方的 1/3 屏幕 */
            box-shadow: 0 -15px 35px rgba(0, 0, 0, 0.6); /* 向上投射的柔和阴影 */
        }

        /* 标题部分：现代、干净、具有仪式感 */
        #site-title {
            margin: 0 0 25px 0;
            color: #ffffff;
            font-size: 1.65rem;
            font-weight: 500;
            letter-spacing: 2px; /* 宽字间距，展现画廊标题感 */
            display: flex;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        }
        
        #site-title::before {
            content: '';
            display: inline-block;
            width: 3px;
            height: 1.2rem;
            background-color: #00d2ff;
            margin-right: 12px;
            border-radius: 1px;
        }

        /* 随笔正文文本容器：使用古典高雅的衬线书宋体 */
        #site-text {
            /* 依次适配：苹果系统的宋体、Windows系统的中易宋体、思源宋体，最后降级到标准衬线体 */
            font-family: "Georgia", "Nimbus Roman No9 L", "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
            color: #e2e2e5; /* 微微调亮字体颜色，确保在深色毛玻璃背景上有极佳的对比度与可读性 */
            font-size: 1.05rem; /* 适当微调中文字体大小，让宋体细节更清晰 */
            text-align: justify; /* 左右两端对齐 */
        }

        /* 段落美化 */
        #site-text p {
            line-height: 2.0; /* 增加到 2.0 倍行高，给予诗意段落更充足的呼吸空间 */
            margin: 0 0 22px 0; /* 略微拉大段间距 */
            text-indent: 2em;    /* 首行缩进两个中文字符 */
            letter-spacing: 0.06em; /* 汉字字间距轻微拉开，营造出铅字印刷般的透气美感 */
        }

        #site-text p:last-child {
            margin-bottom: 0;
        }

        /* 滚动条美化 */
        #photo-stream::-webkit-scrollbar,
        #text-overlay-container::-webkit-scrollbar {
            width: 4px;
        }
        #photo-stream::-webkit-scrollbar-thumb,
        #text-overlay-container::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.12);
            border-radius: 2px;
        }
        #photo-stream::-webkit-scrollbar-track,
        #text-overlay-container::-webkit-scrollbar-track {
            background: transparent;
        }

        /* 全屏图片灯箱 (Lightbox) */
        #lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(10, 10, 12, 0.95);
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #lightbox.active {
            display: flex;
            opacity: 1;
        }
        #lightbox img {
            max-width: 85%;
            max-height: 85%;
            border-radius: 6px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }
        #lightbox.active img {
            transform: scale(1);
        }
        #lightbox .close-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 36px;
            font-weight: 300;
            cursor: pointer;
            transition: color 0.2s;
        }
        #lightbox .close-btn:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- 1/6 居中包裹容器 -->
    <div id="main-wrapper">
        <!-- 底层背景：地图 + 照片 -->
        <div id="media-container">
            <!-- 左侧地图 -->
            <div id="map-container">
                <div id="map"></div>
            </div>

            <!-- 右侧三列九宫格网格 -->
            <div id="photo-stream">
                <!-- 图片卡片由 JavaScript 动态载入 -->
            </div>
        </div>

        <!-- 表层浮动滚动文字层 -->
        <div id="text-overlay-container">
            <!-- 占位器，留出顶部 2/3 -->
            <div class="spacer"></div>
            <!-- 文字内容卡片 -->
            <div id="site-text-card">
                <h3 id="site-title">采样站点信息</h3>
                <div id="site-text">
                    <p>请将鼠标悬停在左侧地图上的亮蓝色标志点，查看该地点的采样故事与现场风光。</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 现场照片大图放大灯箱结构 -->
    <div id="lightbox" onclick="closeLightbox()">
        <span class="close-btn">&times;</span>
        <img id="lightbox-img" src="" alt="放大预览" onclick="event.stopPropagation();" />
    </div>

    <script>
        // 1. 数据配置：陕西潼关湿地（包含每张现场图片的专属标题）
        const sampleData = [
            {
                id: 1,
                name: "陕西潼关湿地",
                lat: 34.615,   // 潼关黄河湿地真实纬度
                lng: 110.263,  // 潼关黄河湿地真实经度
                text: `在夏天，北方的大晴天让人很吃不消。但是夜晚就很柔和了。今天我们班在傍晚集体到黄河边坐快艇，河风吹乱了大家的头发。

远山淡青色。水是黄浊的，不湍急，倒是很缓和，推扫着零散着烟头的土滩。我似乎是第一次见褶皱如此细密的水面，像是布满了银色黑色的发晶。

停靠在码头的船舫顶系满了透明的彩旗，同学们迎着夕阳拍照。天色慢慢变黑，灯塔和山顶开始闪烁，我能听见夜风呼啸的声音了。

我突然想起之前和几个一直生活在内地未见过海的朋友，在外地活动时特地抽出时间去看海。在山道上骑了好久的自行车，问了不少的人，最后终于在广场上的围栏边瞅见了黑黝黝的海。感觉有些可惜，我希望他们那时能看到的是比今天更美丽的大海。`,
                images: [
                    { url: "./smpling/TG1.jpg", title: "滤膜夹取准备" },
                    { url: "./smpling/TG2.jpg", title: "远山风机观测" },
                    { url: "./smpling/TG3.jpg", title: "黄河滩涂沙洲" },
                    { url: "./smpling/TG4.jpg", title: "停泊码头一隅" },
                    { url: "./smpling/TG5.jpg", title: "沿岸防护林区" },
                    { url: "./smpling/TG6.jpg", title: "铁道大桥采样" },
                    { url: "./smpling/TG7.jpg", title: "生境镜中世界" },
                    { url: "./smpling/TG8.jpg", title: "样本采集灌装" }
                ]
            }
        ];

        // 2. 初始化地图并微调中心
        const map = L.map('map', {
            zoomControl: false,       // 隐藏默认的放大缩小按钮
            scrollWheelZoom: false,  // 禁止滚轮缩放
            doubleClickZoom: false,  // 禁止双击放大
            boxZoom: false,          // 禁止框选放大
            dragPan: false,          // 完全锁死拖拽
            touchZoom: false         // 禁止手机端双指缩放
        }).setView([34.0, 108.0], 3);

        // 3. 载入高质量极简暗色底图
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        // 4. 定义亮蓝色闪耀圆圈样式
        const markerOptions = {
            radius: 8,
            fillColor: "#00d2ff", // 电光亮蓝
            color: "#ffffff",     // 白色边缘
            weight: 2,
            opacity: 1,
            fillOpacity: 0.95
        };

        // 5. 灯箱开启与关闭逻辑
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        function openLightbox(imgUrl) {
            lightboxImg.src = imgUrl;
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
        }

        // 监听 ESC 键关闭灯箱
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });

        // 6. 更新展示界面的函数
        function updateRightPanel(data) {
            // 写入地名
            document.getElementById('site-title').innerText = data.name;
            
            // 写入多分段故事
            const textContainer = document.getElementById('site-text');
            textContainer.innerHTML = ''; // 清空原有内容
            
            // 按照换行符切割文本，并过滤掉多余的空行
            const paragraphs = data.text.split('\n');
            paragraphs.forEach(pText => {
                const trimmedText = pText.trim();
                if (trimmedText.length > 0) {
                    const p = document.createElement('p');
                    p.innerText = trimmedText;
                    textContainer.appendChild(p);
                }
            });

            // 载入图片流（三列九宫格网格，强制正方形）
            const stream = document.getElementById('photo-stream');
            stream.innerHTML = ''; 
            data.images.forEach(imgData => {
                // 创建一个包裹卡片容器
                const card = document.createElement('div');
                card.className = 'photo-card';

                // 创建图片
                const img = document.createElement('img');
                img.src = imgData.url;
                img.alt = imgData.title;
                
                // 绑定图片点击查看大图事件
                img.addEventListener('click', () => openLightbox(imgData.url));

                // 处理加载失败
                img.onerror = () => {
                    card.style.display = 'none';
                    console.log(`未找到图片: ${imgData.url}，请确认其放在了 smpling 文件夹内并且文件名正确。`);
                };

                // 创建标题框
                const caption = document.createElement('div');
                caption.className = 'photo-caption';
                caption.innerText = imgData.title;

                // 装配卡片并添加到网格中
                card.appendChild(img);
                card.appendChild(caption);
                stream.appendChild(card);
            });

            // 切换点位时，自动将文字滚动条平滑重置回顶部
            document.getElementById('text-overlay-container').scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 7. 渲染坐标点
        sampleData.forEach(site => {
            const marker = L.circleMarker([site.lat, site.lng], markerOptions).addTo(map);

            // 鼠标悬停事件
            marker.on('mouseover', function () {
                this.setStyle({ fillColor: '#ffffff', radius: 10 }); // 悬停时高亮放大成白色
                updateRightPanel(site);
            });

            // 鼠标移出事件
            marker.on('mouseout', function () {
                this.setStyle(markerOptions); // 恢复原状
            });

            // 鼠标点击事件（兼顾触屏设备）
            marker.on('click', function () {
                updateRightPanel(site);
            });
        });

        // 8. 页面首次加载时，默认自动展示第一个采样点（潼关湿地）的内容
        if (sampleData.length > 0) {
            updateRightPanel(sampleData[0]);
        }
    </script>
</body>
</html>
