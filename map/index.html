    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: #f8f9fa;
        }

        #main-wrapper {
            width: 100%;
            height: calc(100vh - 56px);
            position: relative;
            overflow: hidden;
        }

        #media-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            z-index: 1;
        }

        #map-container {
            width: 50%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        #photo-stream {
            width: 50%;
            height: 100%;
            box-sizing: border-box;
            padding: 40px 30px 45vh 30px;
            background-color: #ffffff;
            border-left: 1px solid #e9ecef;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            grid-auto-rows: max-content;
            overflow-y: auto;
        }

        .photo-card {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            border: 1px solid #e9ecef;
        }
        
        .photo-card:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }

        .photo-card img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            transition: filter 0.3s ease;
            cursor: pointer;
        }

        .photo-card:hover img {
            filter: brightness(1.02);
        }

        .photo-caption {
            padding: 8px 5px;
            color: #6c757d;
            font-size: 0.72rem;
            text-align: center;
            font-weight: 400;
            letter-spacing: 1px;
            background-color: #f8f9fa;
            border-top: 1px solid #e9ecef;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        #text-overlay-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            z-index: 2;
            pointer-events: none;
        }

        #text-overlay-container .spacer {
            height: 66.67%;
            pointer-events: none;
        }

        #site-text-card {
            pointer-events: auto;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.99) 150px, #ffffff 100%);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            padding: 45px 55px 65px 55px;
            box-sizing: border-box;
            min-height: 33.33%;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.08);
        }

        #site-title {
            margin: 0 0 25px 0;
            color: #212529;
            font-size: 1.65rem;
            font-weight: 600;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        }
        
        #site-title::before {
            content: '';
            display: inline-block;
            width: 3px;
            height: 1.2rem;
            background-color: #007bff;
            margin-right: 12px;
            border-radius: 1px;
        }

        #site-text {
            font-family: "Georgia", "Nimbus Roman No9 L", "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
            color: #495057;
            font-size: 1.05rem;
            text-align: justify;
        }

        #site-text p {
            line-height: 2.0;
            margin: 0 0 22px 0;
            text-indent: 2em;
            letter-spacing: 0.06em;
        }

        #site-text p:last-child {
            margin-bottom: 0;
        }

        #photo-stream::-webkit-scrollbar,
        #text-overlay-container::-webkit-scrollbar {
            width: 6px;
        }
        #photo-stream::-webkit-scrollbar-thumb,
        #text-overlay-container::-webkit-scrollbar-thumb {
            background-color: rgba(0, 0, 0, 0.1);
            border-radius: 3px;
        }
        #photo-stream::-webkit-scrollbar-track,
        #text-overlay-container::-webkit-scrollbar-track {
            background: transparent;
        }

        #lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(255, 255, 255, 0.95);
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #lightbox.active {
            display: flex;
            opacity: 1;
        }
        #lightbox img {
            max-width: 85%;
            max-height: 85%;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }
        #lightbox.active img {
            transform: scale(1);
        }
        #lightbox .close-btn {
            position: absolute;
            top: 80px;
            right: 40px;
            color: rgba(0, 0, 0, 0.4);
            font-size: 36px;
            font-weight: 300;
            cursor: pointer;
            transition: color 0.2s;
        }
        #lightbox .close-btn:hover {
            color: #212529;
        }
    </style>
</head>
<body class="nav-fixed quarto-light">

        <nav class="navbar navbar-expand-lg" data-bs-theme="dark">
            <div class="navbar-container container-fluid">
                <div class="navbar-brand-container mx-auto">
                    <a class="navbar-brand" href="../index.html">
                        <span class="navbar-title">sssssldy</span>

                </div>
                <div id="quarto-search" class="" title="Search"></div>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" role="menu" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>

                    <ul class="navbar-nav navbar-nav-scroll ms-auto">

    <div id="main-wrapper">
        <div id="media-container">
            <div id="map-container">
                <div id="map"></div>
            </div>

            <div id="photo-stream">
            </div>
        </div>

        <div id="text-overlay-container">
            <div class="spacer"></div>
            <div id="site-text-card">
                <h3 id="site-title">采样站点信息</h3>
                <div id="site-text">
                    <p>请将鼠标悬停在左侧地图上的蓝色标志点，查看该地点的采样故事与现场风光。</p>
                </div>
            </div>
        </div>
    </div>

    <div id="lightbox" onclick="closeLightbox()">
        <span class="close-btn">&times;</span>
        <img id="lightbox-img" src="" alt="放大预览" onclick="event.stopPropagation();" />
    </div>

    <script>
        const sampleData = [
            {
                id: 1,
                name: "陕西潼关湿地",
                lat: 34.615,
                lng: 110.263,
                text: `在夏天，北方的大晴天让人很吃不消。但是夜晚就很柔和了。今天我们班在傍晚集体到黄河边坐快艇，河风吹乱了大家的头发。

远山淡青色。水是黄浊的，不湍急，倒是很缓和，推扫着零散着烟头的土滩。我似乎是第一次见褶皱如此细密的水面，像是布满了银色黑色的发晶。

停靠在码头的船舫顶系满了透明的彩旗，同学们迎着夕阳拍照。天色慢慢变黑，灯塔和山顶开始闪烁，我能听见夜风呼啸的声音了。

我突然想起之前和几个一直生活在内地未见过海的朋友，在外地活动时特地抽出时间去看海。在山道上骑了好久的自行车，问了不少的人，最后终于在广场上的围栏边瞅见了黑黝黝的海。感觉有些可惜，我希望他们那时能看到的是比今天更美丽的大海。`,
                images: [
                    { url: "./smpling/TG1.jpg", title: "滤膜夹取准备" },
                    { url: "./smpling/TG2.jpg", title: "远山风机观测" },
                    { url: "./smpling/TG3.jpg", title: "黄河滩涂沙洲" },
                    { url: "./smpling/TG4.jpg", title: "停泊码头一隅" },
                    { url: "./smpling/TG5.jpg", title: "沿岸防护林区" },
                    { url: "./smpling/TG6.jpg", title: "铁道大桥采样" },
                    { url: "./smpling/TG7.jpg", title: "生境镜中世界" },
                    { url: "./smpling/TG8.jpg", title: "样本采集灌装" }
                ]
            }
        ];

        const map = L.map('map', {
            zoomControl: false,
            scrollWheelZoom: false,
            doubleClickZoom: false,
            boxZoom: false,
            dragPan: false,
            touchZoom: false
        }).setView([34.0, 108.0], 3);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        const markerOptions = {
            radius: 8,
            fillColor: "#007bff",
            color: "#ffffff",
            weight: 2,
            opacity: 1,
            fillOpacity: 0.95
        };

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        function openLightbox(imgUrl) {
            lightboxImg.src = imgUrl;
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });

        function updateRightPanel(data) {
            document.getElementById('site-title').innerText = data.name;
            
            const textContainer = document.getElementById('site-text');
            textContainer.innerHTML = '';
            
            const paragraphs = data.text.split('\n');
            paragraphs.forEach(pText => {
                const trimmedText = pText.trim();
                if (trimmedText.length > 0) {
                    const p = document.createElement('p');
                    p.innerText = trimmedText;
                    textContainer.appendChild(p);
                }
            });

            const stream = document.getElementById('photo-stream');
            stream.innerHTML = '';
            data.images.forEach(imgData => {
                const card = document.createElement('div');
                card.className = 'photo-card';

                const img = document.createElement('img');
                img.src = imgData.url;
                img.alt = imgData.title;
                
                img.addEventListener('click', () => openLightbox(imgData.url));

                img.onerror = () => {
                    card.style.display = 'none';
                    console.log(`未找到图片: ${imgData.url}`);
                };

                const caption = document.createElement('div');
                caption.className = 'photo-caption';
                caption.innerText = imgData.title;

                card.appendChild(img);
                card.appendChild(caption);
                stream.appendChild(card);
            });

            document.getElementById('text-overlay-container').scrollTo({ top: 0, behavior: 'smooth' });
        }

        sampleData.forEach(site => {
            const marker = L.circleMarker([site.lat, site.lng], markerOptions).addTo(map);

            marker.on('mouseover', function () {
                this.setStyle({ fillColor: '#0056b3', radius: 10 });
                updateRightPanel(site);
            });

            marker.on('mouseout', function () {
                this.setStyle(markerOptions);
            });

            marker.on('click', function () {
                updateRightPanel(site);
            });
        });

        if (sampleData.length > 0) {
            updateRightPanel(sampleData[0]);
        }
    </script>
</body>
