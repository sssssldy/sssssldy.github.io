<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>野外采样画廊 – sssssldy</title>
    <link href="../site_libs/bootstrap/bootstrap-icons.css" rel="stylesheet">
    <link href="../site_libs/bootstrap/bootstrap-a0f9fd0d421825b736dc1bbcbcba2219.min.css" rel="stylesheet">
    <script src="../site_libs/bootstrap/bootstrap.min.js"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: #f8f9fa;
        }

        .gallery-container {
            display: flex;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .gallery-main {
            flex: 1;
        }
        
        .gallery-sidebar {
            width: 250px;
            flex-shrink: 0;
        }
        
        .filter-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        
        .filter-tab {
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid #dee2e6;
            background-color: #ffffff;
            color: #495057;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .filter-tab:hover {
            border-color: #007bff;
            color: #007bff;
        }
        
        .filter-tab.active {
            background-color: #007bff;
            border-color: #007bff;
            color: #ffffff;
        }
        
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        
        .gallery-item {
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid #e9ecef;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .gallery-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }
        
        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        
        .gallery-item .item-content {
            padding: 16px;
        }
        
        .gallery-item h3 {
            margin: 0 0 8px 0;
            font-size: 1rem;
            color: #212529;
        }
        
        .gallery-item p {
            margin: 0;
            font-size: 0.875rem;
            color: #6c757d;
            line-height: 1.5;
        }
        
        .gallery-item .year-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            background-color: #e9ecef;
            color: #495057;
            font-size: 0.75rem;
            margin-bottom: 8px;
        }
        
        .gallery-item .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 8px;
        }
        
        .gallery-item .tag {
            padding: 2px 8px;
            border-radius: 4px;
            background-color: #e3f2fd;
            color: #1976d2;
            font-size: 0.7rem;
        }
        
        .sidebar-section {
            background-color: #ffffff;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #e9ecef;
            margin-bottom: 20px;
        }
        
        .sidebar-section h4 {
            margin: 0 0 16px 0;
            font-size: 1rem;
            color: #212529;
            font-weight: 600;
        }
        
        .sidebar-section ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .sidebar-section li {
            margin-bottom: 8px;
        }
        
        .sidebar-section li:last-child {
            margin-bottom: 0;
        }
        
        .sidebar-section a {
            color: #495057;
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s;
        }
        
        .sidebar-section a:hover {
            color: #007bff;
        }
        
        .sidebar-section .count {
            float: right;
            color: #6c757d;
            font-size: 0.8rem;
        }
        
        @media (max-width: 992px) {
            .gallery-container {
                flex-direction: column;
            }
            
            .gallery-sidebar {
                width: 100%;
            }
            
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 576px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header id="quarto-header" class="headroom fixed-top">
        <nav class="navbar navbar-expand-lg" data-bs-theme="dark">
            <div class="navbar-container container-fluid">
                <div class="navbar-brand-container mx-auto">
                    <a class="navbar-brand" href="../index.html">
                        <span class="navbar-title">sssssldy</span>
                    </a>
                </div>
                <div id="quarto-search" class="" title="Search"></div>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" role="menu" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarCollapse">
                    <ul class="navbar-nav navbar-nav-scroll ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="../about.html">
                                <span class="menu-text">About</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../index.html">
                                <i class="bi bi-github" role="img"></i>
                                <span class="menu-text">sssssldy</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="../gallery/index.html" aria-current="page">
                                <span class="menu-text">画廊</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../map/index.html">
                                <span class="menu-text">地图</span>
                            </a>
                        </li>
                        <li class="nav-item compact">
                            <a class="nav-link" href="https://bsky.app/">
                                <i class="bi bi-bluesky" role="img"></i>
                                <span class="menu-text"></span>
                            </a>
                        </li>
                    </ul>
                </div>
                <div class="quarto-navbar-tools"></div>
            </div>
        </nav>
    </header>

    <div id="quarto-content" style="padding-top: 70px;">
        <main class="content">
            <header class="quarto-title-block default">
                <div class="quarto-title">
                    <h1 class="title">野外采样画廊</h1>
                    <p class="subtitle lead">行走在湖泊与湿地之间的科研纪实</p>
                </div>
            </header>

            <p>这里记录了我们在野外进行水体采样、湿地调查以及环境 DNA 过滤的工作瞬间与风景。</p>

            <div class="gallery-container">
                <div class="gallery-main">
                    <div class="filter-tabs">
                        <button class="filter-tab active" onclick="filterGallery('all')">全部</button>
                        <button class="filter-tab" onclick="filterGallery('2025')">2025</button>
                        <button class="filter-tab" onclick="filterGallery('2026')">2026</button>
                    </div>

                    <div class="gallery-grid" id="gallery-container">
                    </div>
                </div>

                <div class="gallery-sidebar">
                    <div class="sidebar-section">
                        <h4>分类</h4>
                        <ul>
                            <li><a href="#" onclick="filterGallery('all'); return false;">全部 <span class="count">2</span></a></li>
                            <li><a href="#" onclick="filterGalleryByCategory('水体采样'); return false;">水体采样 <span class="count">1</span></a></li>
                            <li><a href="#" onclick="filterGalleryByCategory('湿地调查'); return false;">湿地调查 <span class="count">1</span></a></li>
                        </ul>
                    </div>
                    
                    <div class="sidebar-section">
                        <h4>年份</h4>
                        <ul>
                            <li><a href="#" onclick="filterGallery('all'); return false;">全部 <span class="count">2</span></a></li>
                            <li><a href="#" onclick="filterGallery('2025'); return false;">2025 <span class="count">2</span></a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const galleryItems = [
            {
                title: "湖泊水体采样",
                description: "现场采集水样，用于后续浮游植物群落分析与理化指标测定。",
                image: "photos/lake_sampling1.jpg",
                year: "2025",
                category: "水体采样",
                tags: ["湖泊", "浮游植物", "理化指标"]
            },
            {
                title: "湿地野外观测",
                description: "wetland 采样点的生态景观与水样环境 DNA (eDNA) 现场过滤。",
                image: "photos/lake_sampling2.jpg",
                year: "2025",
                category: "湿地调查",
                tags: ["湿地", "eDNA", "生态景观"]
            }
        ];

        function renderGallery(items) {
            const container = document.getElementById('gallery-container');
            container.innerHTML = '';
            
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'gallery-item';
                card.dataset.year = item.year;
                card.dataset.category = item.category;
                
                const tagsHtml = item.tags.map(tag => `<span class="tag">${tag}</span>`).join('');
                
                card.innerHTML = `
                    <img src="${item.image}" alt="${item.title}" />
                    <div class="item-content">
                        <span class="year-badge">${item.year}</span>
                        <h3>${item.title}</h3>
                        <p>${item.description}</p>
                        <div class="tags">${tagsHtml}</div>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        function filterGallery(year) {
            const tabs = document.querySelectorAll('.filter-tab');
            tabs.forEach(tab => {
                if ((year === 'all' && tab.textContent === '全部') || tab.textContent === year) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });
            
            const filteredItems = year === 'all' 
                ? galleryItems 
                : galleryItems.filter(item => item.year === year);
            
            renderGallery(filteredItems);
        }

        function filterGalleryByCategory(category) {
            const filteredItems = category === 'all' 
                ? galleryItems 
                : galleryItems.filter(item => item.category === category);
            
            renderGallery(filteredItems);
        }

        renderGallery(galleryItems);
    </script>
</body>
</html>
